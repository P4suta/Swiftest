name: quality

on:
  push:
  pull_request:

jobs:
  assurance:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select --switch /Applications/Xcode_27.0.app
      - run: curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
      - run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: Scripts/quality
      - uses: actions/checkout@v5
        with:
          repository: P4suta/njutest
          path: dogfood/njutest
      - run: Scripts/dogfood "$GITHUB_WORKSPACE/dogfood/njutest/fast-anser"
