name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assurance:
    name: Verify source and proofs
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Select pinned Xcode
        run: sudo xcode-select --switch /Applications/Xcode_27.0.app
      - name: Install pinned proof toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64)
              architecture=aarch64
              checksum=7ad829861392c718dfebde3a83b5c8508df47be02af68894b094b0b3952616e5
              ;;
            x86_64)
              architecture=x86_64
              checksum=8a340b309d8ed2e96f930761fa223b3af57a38f5d253b53ac90293c9516f8cd4
              ;;
            *) exit 1 ;;
          esac
          archive="${RUNNER_TEMP}/elan-${architecture}-apple-darwin.tar.gz"
          gh release download v4.2.4 --repo leanprover/elan \
            --pattern "elan-${architecture}-apple-darwin.tar.gz" --output "${archive}"
          printf '%s  %s\n' "${checksum}" "${archive}" | shasum -a 256 --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/elan-init" -y --no-modify-path \
            --default-toolchain leanprover/lean4:v4.34.1
          printf '%s\n' "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
      - name: Verify source and proofs
        run: Scripts/quality
      - name: Check out external test target
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: P4suta/njutest
          path: .build/dogfood/njutest
          persist-credentials: false
      - name: Verify external test target
        run: Scripts/dogfood "$GITHUB_WORKSPACE/.build/dogfood/njutest/fast-anser"
